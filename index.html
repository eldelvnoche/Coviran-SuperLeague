    <style>
        :root {
            --bg-base: #0B0B0B;
            --bg-card: #141414;
            --bg-card-hover: #1c1c1c;
            --border-color: #262626;
            --accent-gold: #E5B842;
            --accent-gold-light: #f3d069;
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --nav-height: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            padding-bottom: calc(var(--nav-height) + 20px);
            min-height: 100vh;
        }

        /* HEADER */
        header {
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(11,11,11,1) 100%), 
                        repeating-linear-gradient(45deg, #111 0, #111 10px, #0B0B0B 10px, #0B0B0B 20px);
            padding: 30px 20px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: -1px;
            line-height: 1;
            background: linear-gradient(180deg, #FFF 0%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* BOTTOM NAVBAR */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.65rem;
            font-weight: 700;
            gap: 4px;
            width: 20%;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        .nav-item.active {
            color: var(--accent-gold);
        }

        /* CONTAINER VIEWS */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* PODIUM */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            margin-bottom: 25px;
            padding-top: 15px;
        }

        .podium-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .podium-card.first {
            border-color: var(--accent-gold);
            transform: scale(1.05);
            z-index: 2;
            background: linear-gradient(180deg, #1f1a0c 0%, var(--bg-card) 100%);
        }

        .podium-rank {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent-gold);
            margin-bottom: 6px;
        }

        .podium-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .podium-team {
            font-size: 0.8rem;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .podium-user {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .podium-pts {
            font-size: 0.9rem;
            font-weight: 900;
            color: var(--text-main);
        }

        /* TABLE */
        .table-container {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #1A1A1A;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 12px 8px;
            text-transform: uppercase;
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
        }

        tr:last-child td {
            border-bottom: none;
        }
