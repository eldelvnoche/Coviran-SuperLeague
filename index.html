<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Superliga Covirán</title>
<style>
:root{--bg:#0a1430;--panel:#101c40;--line:#233463;--text:#eef2ff;--mute:#8b9bc7;--gold:#f2c14e;--win:#3ddc97;--loss:#ff6b6b;--field:#0d1a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef2fb;--panel:#fff;--line:#cfd8ee;--text:#0f1b3d;--mute:#5a6a96;--gold:#a87400;--win:#12945f;--loss:#d63c3c;--field:#f4f7ff}}
:root[data-theme="light"]{--bg:#eef2fb;--panel:#fff;--line:#cfd8ee;--text:#0f1b3d;--mute:#5a6a96;--gold:#a87400;--win:#12945f;--loss:#d63c3c;--field:#f4f7ff}
:root[data-theme="dark"]{--bg:#0a1430;--panel:#101c40;--line:#233463;--text:#eef2ff;--mute:#8b9bc7;--gold:#f2c14e;--field:#0d1a3a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:17px;line-height:1.35}
main{max-width:640px;margin:0 auto;padding:18px 12px 40px}
h1{margin:0;font-size:34px;line-height:1;font-weight:800}
h1 small{display:block;color:var(--gold);font-size:17px;font-weight:600;margin-top:6px}
.tabs{display:flex;gap:6px;margin:16px 0 0}
.tabs button{flex:1;background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-weight:700;font-size:18px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--gold);color:#1a1300;border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:14px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 5px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:14px}
tr:last-child td{border-bottom:0}
td.team,th.team{text-align:left;white-space:nowrap}
.pos{width:26px;color:var(--mute);font-weight:700}
.lg{width:40px;height:28px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none;display:block}
.nm{font-weight:700;display:block}.tt{display:block;color:var(--mute);font-size:13px;font-weight:500;line-height:1.1}.tc{display:inline-flex;align-items:center;gap:9px;vertical-align:middle}
td.pts{color:var(--gold);font-weight:800;font-size:19px}
tbody tr:first-child td.pos{color:var(--gold)}
tbody tr:first-child{background:linear-gradient(90deg,rgba(242,193,78,.14),transparent)}
.up{color:var(--win)}.dn{color:var(--loss)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-top:14px}
.chips button{flex:0 0 auto;min-width:44px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-weight:700;cursor:pointer;position:relative}
.chips button[aria-pressed="true"]{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.chips button.done::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--win)}
.lead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 0}
.lead b{font-size:24px}.lead span{color:var(--mute)}
.m{display:grid;grid-template-columns:1fr 46px 10px 46px 1fr;gap:6px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.m .h,.m .a{text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}.m .lg{width:52px;height:36px}

.m b{text-align:center;color:var(--mute)}
.m input{width:100%;min-width:0;text-align:center;font:inherit;font-weight:800;font-size:19px;background:var(--field);color:var(--gold);border:1px solid var(--line);border-radius:8px;padding:8px 0}
.m.w1 .h .nm,.m.w2 .a .nm{color:var(--win)}
.rest{padding:12px;color:var(--mute)}
.rest b{color:var(--text)}
.hint{color:var(--mute);font-size:15px;margin:10px 2px 0}
.reset{margin-top:18px;background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
</style>
</head>

var H=S[m[0]],A=S[m[1]];H.pj++;A.pj++;H.gf+=v[0];H.gc+=v[1];A.gf+=v[1];A.gc+=v[0];
if(v[0]>v[1]){H.pg++;A.pp++}else if(v[0]<v[1]){A.pg++;H.pp++}else{H.pe++;A.pe++}})});
var L=Object.keys(S).map(function(i){var r=S[i];r.dg=r.gf-r.gc;r.pts=r.pg*3+r.pe;return r});
L.sort(function(a,b){return b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||T[a.id].p.localeCompare(T[b.id].p)});
return L}
function renderTable(){
document.getElementById("tb").innerHTML=table().map(function(r,i){
var d=r.dg>0?"+"+r.dg:""+r.dg,c=r.dg>0?"up":r.dg<0?"dn":"";
return '<tr><td class="pos">'+(i+1)+'</td><td class="team"><span class="tc">'+logo(r.id)+'<span><span class="nm">'+T[r.id].t+'</span><span class="tt">'+T[r.id].p+'</span></span></span></td><td>'+r.pj+'</td><td>'+r.pg+'</td><td>'+r.pe+'</td><td>'+r.pp+'</td><td>'+r.gf+'</td><td>'+r.gc+'</td><td class="'+c+'">'+d+'</td><td class="pts">'+r.pts+'</td></tr>'}).join("")}
var cur=0;
for(var q=0;q<J.length;q++){if(J[q].ms.some(function(m){return!R[k(q,m[0],m[1])]})){cur=q;break}}
function doneJ(j){return J[j].ms.every(function(m){return R[k(j,m[0],m[1])]})}
function renderChips(){
document.getElementById("chips").innerHTML=J.map(function(_,j){
return '<button data-j="'+j+'" aria-pressed="'+(j===cur)+'" class="'+(doneJ(j)?"done":"")+'" aria-label="Jornada '+(j+1)+'">'+(j+1)+'</button>'}).join("")}
function side(id,cls){return '<span class="'+cls+'">'+logo(id)+'<span class="nm">'+T[id].t+'</span><span class="tt">'+T[id].p+'</span></span>'}
function renderJ(){
document.getElementById("jt").textContent="Jornada "+(cur+1);
document.getElementById("jv").textContent=cur<9?"Primera vuelta":"Segunda vuelta";
var r=J[cur];
document.getElementById("jm").innerHTML=r.ms.map(function(m){
var v=R[k(cur,m[0],m[1])]||["",""];
var w=v[0]===""?"":v[0]>v[1]?" w1":v[0]<v[1]?" w2":"";
return '<div class="m'+w+'">'+side(m[0],"h")+'<input inputmode="numeric" type="number" min="0" max="99" data-k="'+k(cur,m[0],m[1])+'" data-s="0" value="'+v[0]+'" aria-label="Goles '+T[m[0]].t+'"><b>-</b><input inputmode="numeric" type="number" min="0" max="99" data-k="'+k(cur,m[0],m[1])+'" data-s="1" value="'+v[1]+'" aria-label="Goles '+T[m[1]].t+'">'+side(m[1],"a")+'</div>'}).join("")+
'<div class="rest">Descansa: <b>'+T[r.rest].t+'</b> ('+T[r.rest].p+')</div>'}
document.getElementById("chips").addEventListener("click",function(e){
var j=e.target.getAttribute("data-j");if(j===null)return;cur=+j;renderChips();renderJ()});
document.getElementById("jm").addEventListener("change",function(e){
var key=e.target.getAttribute("data-k");if(!key)return;
var box=e.target.parentNode.querySelectorAll("input");
var a=box[0].value,b=box[1].value;
if(a===""||b===""){if(a===""&&b===""){delete R[key]}else{return}}
else{R[key]=[Math.max(0,parseInt(a,10)||0),Math.max(0,parseInt(b,10)||0)]}
save();renderTable();renderChips();renderJ()});
document.getElementById("rs").addEventListener("click",function(){
if(window.confirm("¿Borrar todos los resultados?")){R={};save();renderTable();renderChips();renderJ()}});
function tab(n){
document.getElementById("v1").hidden=n!==1;document.getElementById("v2").hidden=n!==2;
document.getElementById("t1").setAttribute("aria-selected",n===1);
document.getElementById("t2").setAttribute("aria-selected",n===2)}
document.getElementById("t1").addEventListener("click",function(){tab(1)});
document.getElementById("t2").addEventListener("click",function(){tab(2)});
renderTable();renderChips();renderJ();
</script>
</body>
</html>
