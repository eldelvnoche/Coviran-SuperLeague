<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Superliga Covirán · eFootball</title>
<meta name="description" content="Clasificación y calendario de la Superliga Covirán de eFootball.">
<meta property="og:type" content="website">
<meta property="og:title" content="Superliga Covirán · eFootball">
<meta property="og:description" content="Clasificación y calendario de la liga. Se actualiza tras cada jornada.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark light;--bg:#0d0b07;--panel:#17130b;--panel2:#211a0d;--line:#3a2f17;--text:#fbf4e1;--mute:#b3a483;--gold:#f0be4d;--gg:linear-gradient(135deg,#ffe29a,#f0be4d 45%,#b9831a);--h1:linear-gradient(135deg,#fff0c2,#f0be4d 50%,#c28a1e);--win:#4fd89a;--loss:#ff6b5e;--stripe:rgba(240,190,77,.05);--on-gold:#1d1400;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root{--bg:#faf5e6;--panel:#fffdf6;--panel2:#f4ecd4;--line:#e3d5a8;--text:#2a2008;--mute:#7d6b3c;--gold:#a87408;--gg:linear-gradient(135deg,#f6d77a,#e2a82a 50%,#b9831a);--h1:linear-gradient(135deg,#6b4700,#a87408 55%,#7a5200);--win:#12915c;--loss:#d33a3a;--stripe:rgba(168,116,8,.06)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Barlow","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.35}
.hd,h1,.nm,.pt,.n,.sb,.pn,nav button,.jt,.chips button{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
header{padding:26px 16px 22px;background:repeating-linear-gradient(100deg,transparent 0 44px,var(--stripe) 44px 88px);border-bottom:1px solid var(--line)}
header>div{max-width:640px;margin:0 auto}
h1{margin:0;font-size:clamp(46px,14vw,72px);line-height:.88;font-weight:800;letter-spacing:-.01em;background:var(--h1);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
header p{margin:10px 0 0;color:var(--gold);font-weight:600;font-size:18px;font-family:"Barlow Condensed",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 12px 110px}
.err{color:var(--loss);margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lg{width:54px;height:34px;object-fit:cover;border-radius:8px;border:2px solid var(--gold);flex:none;display:block;background:#fff}
.nm{font-weight:700;display:block;font-size:19px;line-height:1.05}
.tt{display:block;color:var(--mute);font-size:13px;line-height:1.15;font-weight:500}
/* podium */
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:14px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.pc .lg{width:82px;height:53px;border-radius:10px}
.pc.p1{padding-top:18px;padding-bottom:16px;background:var(--panel2);border-color:var(--gold);box-shadow:0 10px 30px -8px rgba(240,190,77,.28)}
.pc.p1 .lg{width:104px;height:67px;border-radius:12px}
.pn{color:var(--mute);font-weight:700;font-size:18px}
.p1 .pn{color:var(--gold)}
.pc .nm{font-size:18px}
.pc .big{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:34px;line-height:1;color:var(--gold)}
.p1 .big{font-size:46px}
.pc .big small{font-size:14px;color:var(--mute);font-weight:600;margin-left:3px}
/* table */
.hdr,.main{display:grid;grid-template-columns:26px 1fr 28px 38px 40px;gap:4px;align-items:center;width:100%}
.hdr{padding:10px 12px;color:var(--mute);font-weight:600;font-size:14px;border-bottom:1px solid var(--line);text-align:center;font-family:"Barlow Condensed",sans-serif}
.hdr span:nth-child(2){text-align:left}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.main{background:none;border:0;color:inherit;font:inherit;text-align:left;padding:10px 12px;cursor:pointer}
.main:focus-visible,nav button:focus-visible,.chips button:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.row:first-child .main{box-shadow:inset 3px 0 0 var(--gold)}
.ps{color:var(--mute);font-weight:700;text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:18px}
.tc{display:flex;align-items:center;gap:10px;min-width:0}
.tn{min-width:0}
.n{text-align:center;font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.n.pt{color:var(--gold);font-weight:800;font-size:24px}
.up{color:var(--win)}.dn{color:var(--loss)}
.dt{display:grid;grid-template-columns:repeat(5,1fr) 1.4fr;gap:6px;padding:4px 12px 14px 12px;text-align:center}
.dt[hidden]{display:none}
.st b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;line-height:1}
.st span{color:var(--mute);font-size:12px}
.fm{display:flex;gap:4px;justify-content:center;align-items:center}
.fm i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.fm i.w{background:var(--win)}.fm i.l{background:var(--loss)}.fm i.d{background:var(--mute)}
.hint{color:var(--mute);font-size:14px;margin:10px 4px 0}
/* calendar */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips button{flex:0 0 auto;min-width:46px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;font-size:19px;cursor:pointer;position:relative}
.chips button[aria-pressed="true"]{background:var(--gg);color:var(--on-gold);border-color:var(--gold)}
.chips button.done::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--win)}
.lead{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 10px}
.jt{font-size:30px;font-weight:800;line-height:1}
.lead span{color:var(--mute)}.lead .jt{color:var(--text)}
.mc{display:grid;grid-template-columns:1fr 92px 1fr;gap:6px;align-items:center;padding:14px 10px;border-bottom:1px solid var(--line)}
.mc .tm{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.mc .lg{width:80px;height:52px;border-radius:10px}
.sb{display:flex;justify-content:center;align-items:center;gap:6px;font-size:38px;font-weight:800;color:var(--gold);line-height:1}
.sb i{font-style:normal;color:var(--mute);font-size:26px}
.sb em{font-style:normal;color:var(--mute);font-size:20px;font-weight:600}
.mc.w1 .tm.a,.mc.w2 .tm.h{opacity:.55}
.rest{padding:12px 14px;color:var(--mute)}
.rest b{color:var(--text)}
/* results */
.jh{padding:9px 14px;color:var(--mute);font-weight:700;background:var(--panel2);border-bottom:1px solid var(--line);font-family:"Barlow Condensed",sans-serif;font-size:17px}
.r1{display:grid;grid-template-columns:1fr 78px 1fr;gap:8px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.r1 .l{text-align:right}
.r1 .s{text-align:center;color:var(--gold);font-weight:800;font-size:26px;font-family:"Barlow Condensed",sans-serif}
.empty{padding:18px 14px;color:var(--mute)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:9px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;font-size:15px}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--gold)}
@media (min-width:480px){.hdr,.main{grid-template-columns:26px 1fr 30px 42px 44px}}
@media (prefers-reduced-motion:no-preference){.pod{animation:up .5s ease both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
</style>
</head>

<header><div><h1>Superliga<br>Covirán</h1><p>Sabadell-Tanger de eFootball</p></div></header>
<main>
<p class="err" id="err" role="alert" hidden></p>

<section id="v1">
<div class="pod" id="pod" hidden></div>

<div class="hdr"><span>#</span><span>Equipo</span><span>PJ</span><span>DG</span><span>Pts</span></div>
<div id="tb"></div></div>
<p class="hint" id="upd"></p>
<p class="hint">Toca un equipo para ver su detalle. GF son los goles a favor y GC los goles en contra.</p>
</section>

<section id="v2" hidden>
<div class="chips" id="chips"></div>
<div class="lead"><span class="jt" id="jt"></span><span id="jv"></span></div>
<div class="card" id="jm"></div>
<p class="hint" id="upd2"></p>
</section>

<section id="v3" hidden>
<div class="card" id="rl"></div>
<p class="hint" id="upd3"></p>
</section>
</main>

<nav><div role="tablist">

</div></nav>

function crest(id){return IMG[id]}
var T={
dm:{p:"Demian",t:"R. Madrid"},rb:{p:"Reda",t:"Barça"},
th:{p:"Taha",t:"Arsenal"},md:{p:"Mouad",t:"Inter Milan"},
hs:{p:"Husam",t:"PSG"},zk:{p:"Zaka",t:"AS FAR"},
bd:{p:"Badr",t:"Boca Juniors"},ej:{p:"Elouejdi",t:"Japón"},
fd:{p:"Fahd",t:"IRT"}};
var V1=["bd-dm,hs-rb,ej-md,fd-th|zk","zk-fd,th-ej,md-hs,rb-bd|dm","dm-rb,bd-md,hs-th,ej-zk|fd",
"fd-ej,zk-hs,th-bd,md-dm|rb","rb-md,dm-th,bd-zk,hs-fd|ej","ej-hs,fd-bd,zk-dm,th-rb|md",
"md-th,rb-zk,dm-fd,bd-ej|hs","hs-bd,ej-dm,fd-rb,zk-md|th","th-zk,md-fd,rb-ej,dm-hs|bd"];
var J=[];
function parse(s,flip){var a=s.split("|");return{rest:a[1],ms:a[0].split(",").map(function(x){var p=x.split("-");return flip?[p[1],p[0]]:[p[0],p[1]]})}}
V1.forEach(function(s){J.push(parse(s,false))});
V1.forEach(function(s){J.push(parse(s,true))});
var R={},cur=0,fecha="";
function $(i){return document.getElementById(i)}
function k(j,h,a){return(j+1)+":"+h+":"+a}
function logo(id){return '<img class="lg" alt="" aria-hidden="true" src="'+crest(id)+'">'}
function nmp(id){return '<span class="nm">'+T[id].t+'</span><span class="tt">'+T[id].p+'</span>'}
function table(){
var S={};Object.keys(T).forEach(function(i){S[i]={id:i,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,f:[]}});
J.forEach(function(r,j){r.ms.forEach(function(m){var v=R[k(j,m[0],m[1])];if(!v)return;
var H=S[m[0]],A=S[m[1]];H.pj++;A.pj++;H.gf+=v[0];H.gc+=v[1];A.gf+=v[1];A.gc+=v[0];
if(v[0]>v[1]){H.pg++;A.pp++;H.f.push("w");A.f.push("l")}else if(v[0]<v[1]){A.pg++;H.pp++;H.f.push("l");A.f.push("w")}else{H.pe++;A.pe++;H.f.push("d");A.f.push("d")}})});
var L=Object.keys(S).map(function(i){var r=S[i];r.dg=r.gf-r.gc;r.pts=r.pg*3+r.pe;return r});
L.sort(function(a,b){return b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||T[a.id].t.localeCompare(T[b.id].t)});
return L}
function dgt(r){return r.dg>0?"+"+r.dg:""+r.dg}
function renderTable(){
var L=table(),played=L.some(function(r){return r.pj>0});
var pod=$("pod");
if(played){
pod.hidden=false;
pod.innerHTML=[1,0,2].map(function(i){var r=L[i];
return '<div class="pc p'+(i+1)+'"><span class="pn">'+(i+1)+'º</span>'+logo(r.id)+'<span><span class="nm">'+T[r.id].t+'</span><span class="tt">'+T[r.id].p+'</span></span><span class="big">'+r.pts+'<small>pts</small></span></div>'}).join("")}
else{pod.hidden=true}
$("tb").innerHTML=L.map(function(r,i){
var c=r.dg>0?"up":r.dg<0?"dn":"";
var f=r.f.slice(-5).map(function(x){return '<i class="'+x+'"></i>'}).join("")||'<span class="tt">Sin partidos</span>';
return '<div class="row"><button class="main" aria-expanded="false" aria-controls="d'+i+'"><span class="ps">'+(i+1)+'</span><span class="tc">'+logo(r.id)+'<span class="tn">'+nmp(r.id)+'</span></span><span class="n">'+r.pj+'</span><span class="n '+c+'">'+dgt(r)+'</span><span class="n pt">'+r.pts+'</span></button>'+
'<div class="dt" id="d'+i+'" hidden><div class="st"><b>'+r.pg+'</b><span>Ganados</span></div><div class="st"><b>'+r.pe+'</b><span>Empates</span></div><div class="st"><b>'+r.pp+'</b><span>Perdidos</span></div><div class="st"><b>'+r.gf+'</b><span title="Goles a favor">GF</span></div><div class="st"><b>'+r.gc+'</b><span title="Goles en contra">GC</span></div><div class="st"><div class="fm">'+f+'</div><span>Racha</span></div></div></div>'}).join("")}
$("tb").addEventListener("click",function(e){
var b=e.target.closest?e.target.closest(".main"):null;if(!b)return;
var open=b.getAttribute("aria-expanded")==="true";
b.setAttribute("aria-expanded",!open);
b.nextElementSibling.hidden=open});
function doneJ(j){return J[j].ms.every(function(m){return R[k(j,m[0],m[1])]})}
function renderChips(){
$("chips").innerHTML=J.map(function(_,j){
return '<button data-j="'+j+'" aria-pressed="'+(j===cur)+'" class="'+(doneJ(j)?"done":"")+'" aria-label="Jornada '+(j+1)+'">'+(j+1)+'</button>'}).join("")}
function renderJ(){
$("jt").textContent="Jornada "+(cur+1);
$("jv").textContent=cur<9?"Primera vuelta":"Segunda vuelta";
var r=J[cur];
$("jm").innerHTML=r.ms.map(function(m){
var v=R[k(cur,m[0],m[1])];
var w=!v?"":v[0]>v[1]?" w1":v[0]<v[1]?" w2":"";
return '<div class="mc'+w+'"><span class="tm h">'+logo(m[0])+nmp(m[0])+'</span><span class="sb">'+(v?'<b>'+v[0]+'</b><i>:</i><b>'+v[1]+'</b>':'<em>vs</em>')+'</span><span class="tm a">'+logo(m[1])+nmp(m[1])+'</span></div>'}).join("")+
'<div class="rest">Descansa: <b>'+T[r.rest].t+'</b> ('+T[r.rest].p+')</div>'}
document.getElementById("chips").addEventListener("click",function(e){
var j=e.target.getAttribute("data-j");if(j===null)return;cur=+j;renderChips();renderJ()});
function renderRes(){
var h="";
for(var j=J.length-1;j>=0;j--){
var rows=J[j].ms.filter(function(m){return R[k(j,m[0],m[1])]});
if(!rows.length)continue;
h+='<div class="jh">Jornada '+(j+1)+'</div>'+rows.map(function(m){var v=R[k(j,m[0],m[1])];
return '<div class="r1"><span class="l">'+nmp(m[0])+'</span><span class="s">'+v[0]+' - '+v[1]+'</span><span>'+nmp(m[1])+'</span></div>'}).join("")}
$("rl").innerHTML=h||'<div class="empty">Aún no hay resultados.</div>'}
function fmt(f){var p=(f||"").split("-");if(p.length!==3)return "";
return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"})}
function renderAll(){
var t=fecha?"Actualizado el "+fmt(fecha):"";
["upd","upd2","upd3"].forEach(function(i){$(i).textContent=t});
for(var q=0;q<J.length;q++){if(!doneJ(q)){cur=q;break}}
renderTable();renderChips();renderJ();renderRes()}
var NAMES=["tabla","calendario","resultados"];
function tab(n,keep){
[1,2,3].forEach(function(i){$("v"+i).hidden=n!==i;$("t"+i).setAttribute("aria-selected",n===i)});
if(!keep){try{history.replaceState(null,"","#"+NAMES[n-1])}catch(e){}window.scrollTo(0,0)}}
[1,2,3].forEach(function(i){$("t"+i).addEventListener("click",function(){tab(i)})});
var h0=NAMES.indexOf((location.hash||"").slice(1));
if(h0>0)tab(h0+1,true);
renderAll();
fetch("resultados.json?v="+Date.now()).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
fecha=d.actualizado||"";
(d.resultados||[]).forEach(function(x){R[k(x.j-1,x.local,x.visitante)]=[+x.gl,+x.gv]});
renderAll()}).catch(function(){
var e=$("err");e.hidden=false;e.textContent="No se han podido cargar los resultados. Recarga la página en un momento."});
</script>
